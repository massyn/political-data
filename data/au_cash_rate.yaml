description: 'Tracks the Reserve Bank of Australia''s official cash rate target — the interest rate on overnight loans in
  the money market. The RBA uses the cash rate as its primary monetary policy tool to influence inflation and economic growth.
  Changes flow through to consumer and business lending rates. Dates are the actual RBA board decision date, not end-of-month.

  '
