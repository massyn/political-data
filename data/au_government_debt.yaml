description: 'Face value of Australian Government Securities on issue (Treasury Bonds, Treasury Indexed Bonds and Treasury
  Notes), published monthly by the Australian Office of Financial Management (AOFM), in AUD billion at month end. This is
  gross debt: it is not offset by the Government''s financial assets, and it differs from the general government gross debt
  in the Budget papers, which includes other liabilities not managed by the AOFM. Includes securities issued on behalf of
  the States and Territories. Lower is better.'
