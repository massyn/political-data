description: 'Monthly average spot price of Brent crude oil, the global benchmark, in US dollars per barrel. Data is the US
  Energy Information Administration daily spot price, taken from the Federal Reserve Bank of St. Louis (FRED series MCOILBRENTEU),
  from May 1987. Only complete months are shown. It feeds into fuel, transport and food costs, and shifts with wars, pandemics
  and supply decisions, so world events are marked on the chart. No rating is applied: higher prices raise costs for fuel
  importers but lift revenue for exporters, so whether higher or lower is better is contested.'
