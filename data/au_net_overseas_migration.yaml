collector: collectors/au_net_overseas_migration.py
description: 'Net overseas migration to Australia (permanent, temporary and returning arrivals less departures) in the year
  ending each quarter, summed from the ABS quarterly population components. Published by the ABS about six months after the
  quarter ends, so this series lags other indicators. No direction is set: whether higher or lower migration is better is
  a policy judgement, so the figure is shown without a red or green rating.'
