collector: collectors/au_rent_cpi.py
description: Annual percentage change in the rents component of the ABS Consumer Price Index, weighted average of the eight
  capital cities. Computed from the quarterly Rents index (original series) against the same quarter a year earlier, so the
  whole history from 1973 uses one method. Because it uses the quarterly index it can differ slightly from the monthly CPI
  annual change the ABS headlines for the quarter-end month. Lower is better.
