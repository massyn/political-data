description: Victims of homicide recorded by police per 100,000 people, national, from ABS Recorded Crime - Victims (Table
  1). ABS homicide covers murder, attempted murder and manslaughter and excludes driving causing death. Calendar years, dated
  31 December, from 1993. Homicide is the most reliably recorded crime, so the trend is less affected by changes in reporting
  than other offences. Lower is better.
