name: Update data
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check me out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect new data
        id: update
        run: python update.py --force

      - name: Record this run
        run: date -u +%Y-%m-%dT%H:%M:%SZ > lastrun.txt

      - name: Build site
        if: steps.update.outputs.updated != '0'
        run: python build.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lastrun.txt data
          if [ "${{ steps.update.outputs.updated }}" != "0" ]; then
            git commit -m "Update data ($(date -u +%Y-%m-%d))"
          else
            git commit -m "Record data check ($(date -u +%Y-%m-%d))"
          fi
          git push

      - name: Publish to Cloudflare
        if: steps.update.outputs.updated != '0'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.166.0"
          command: pages deploy ./dist --project-name=political-data
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
